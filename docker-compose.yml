version: '3.8'

services:
  tracker:
    build: .
    init: true
    container_name: tracker-local-test
    ports:
      - "3005:3001"
    volumes:
      - ./placement.db:/app/placement.db
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=placement.db
    restart: unless-stopped