version: '3.8'

services:
  app:
    image: us-west1-docker.pkg.dev/your-gcp-project-id/tracker-repo/tracker-app:latest
    init: true
    container_name: tracker-app
    restart: always
    volumes:
      # Mounts the local 'data' folder to '/app/data' inside the container for SQLite
      - ./data:/app/data
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=data/placement.db

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
