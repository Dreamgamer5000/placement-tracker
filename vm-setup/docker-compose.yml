version: '3.8'

services:
  app:
    image: ${GCP_REGION:-us-west1}-docker.pkg.dev/${GCP_PROJECT_ID:-your-gcp-project-id}/${GCP_REPO_NAME:-tracker-repo}/tracker-app:latest
    init: true
    container_name: tracker-app
    restart: always
    volumes:
      - ./data:/app/data
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=data/placement.db
    networks:
      - web_net

networks:
  web_net:
    external: true

